title: Home
icon: home

options:
  create:
    admin: true
    "*": false

columns:
  main:
    width: 2/3
    fields:
      lead:
        label: Presentazione del corso
        type: textarea
        buttons: false
        maxlength: 300
      audiences:
        label: Accessi per chi visita il sito
        type: structure
        max: 4
        help: Una domanda per ogni tipo di visitatore e le pagine a cui porta.
        fields:
          question:
            label: Domanda
            type: text
            required: true
            placeholder: Vuoi iscriverti?
          links:
            label: Pagine
            type: pages
            max: 3
            required: true
          image:
            label: Foto
            type: files
            query: page.images
            multiple: false
            uploads:
              template: immagine
            info: "{{ file.alt.or('Manca il testo alternativo') }}"
            help: Facoltativa, orizzontale. Nella card viene ritagliata in 3:2 attorno al punto di interesse, che puoi spostare aprendo la foto. Se nella versione inglese non la scegli, si usa quella italiana.
      facts:
        label: Il corso in sintesi
        type: structure
        fields:
          label:
            label: Voce
            type: text
            required: true
          value:
            label: Valore
            type: writer
            inline: true
            marks: [bold, link]
  sidebar:
    width: 1/3
    sections:
      evidenza:
        type: fields
        fields:
          featured:
            label: In evidenza
            type: pages
            max: 3
            help: Post o pagine da mostrare in home, nell'ordine della lista. Gli avvisi e le ultime notizie della bacheca si aggiornano da soli.
      images:
        extends: sections/immagini
        label: Foto
        help: Le foto delle card di accesso. Aprile e scrivi sempre il testo alternativo.
